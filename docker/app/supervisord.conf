[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
loglevel=info
logfile=/var/www/storage/logs/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=5

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
autostart=true
autorestart=true
startsecs=2
startretries=5
stopwaitsecs=30
stopsignal=QUIT
stdout_logfile=/var/www/storage/logs/supervisor/stdout/php-fpm.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=/var/www/storage/logs/supervisor/stderr/php-fpm.err.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5
priority=100

# Laravel Horizon — only started when SUPERVISOR_HORIZON_ENABLED=true (set in
# .env / compose environment). Projects that don't use queued jobs should
# leave it unset/false so no idle worker process is spawned.
[program:horizon]
command=/bin/sh -c "if [ \"$SUPERVISOR_HORIZON_ENABLED\" = 'true' ]; then exec php artisan horizon; else exec tail -f /dev/null; fi"
directory=/var/www
autostart=true
autorestart=true
startsecs=3
startretries=5
stopwaitsecs=3600
stopsignal=SIGTERM
stopasgroup=true
killasgroup=true
numprocs=1
stdout_logfile=/var/www/storage/logs/supervisor/stdout/horizon.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/www/storage/logs/supervisor/stderr/horizon.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
priority=200

# Laravel Scheduler — runs `schedule:work` only when APP_ENV=production
# (read from the mounted .env at container start), same as local dev where
# `php artisan serve` / manual cron isn't expected to run continuously.
[program:laravel-scheduler]
command=/bin/sh -c "APP=$(grep '^APP_ENV=' /var/www/.env | cut -d= -f2 | tr -d '\r\n '); if [ \"$APP\" = 'production' ]; then exec php artisan schedule:work --no-interaction; else exec tail -f /dev/null; fi"
directory=/var/www
autostart=true
autorestart=true
startsecs=5
startretries=5
stopwaitsecs=60
stopsignal=SIGTERM
numprocs=1
stdout_logfile=/var/www/storage/logs/supervisor/stdout/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/www/storage/logs/supervisor/stderr/scheduler.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
priority=300
