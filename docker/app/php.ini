post_max_size=64M
memory_limit=512M
max_execution_time=0
max_input_time=0

; OPcache — the official php-fpm image already loads the module itself via
; conf.d/docker-php-ext-opcache.ini (do NOT also add "zend_extension=opcache"
; here, it'll just emit a "Cannot load Zend OPcache - it was already
; loaded" warning on every start); this only tunes it beyond PHP's
; defaults (128MB/10000 files). validate_timestamps=1 + revalidate_freq=2
; keeps a short (~2s) staleness window instead of 0 (always safe for
; local/dev, where code changes on every request) while still getting most
; of the caching benefit in production. Projects that want the full
; production win (skip the mtime stat call entirely) can set
; validate_timestamps=0 in their own project — just remember that then
; requires a php-fpm reload (`./docker.sh restart`) after every deploy for
; changed code to take effect.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=2
opcache.save_comments=1
