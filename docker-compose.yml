services:
  app:
    build:
      context: .
      dockerfile: ./docker/app/Dockerfile
      args:
        - PHP_VERSION=${PHP_VERSION:-8.4}
        - UID=${UID:-1000}
        - USR=${USR:-www-data}
        - GID=${GID:-1000}
        - GRP=${GRP:-www-data}
        - INSTALL_EXT_MYSQL=${INSTALL_EXT_MYSQL:-false}
        - INSTALL_EXT_PGSQL=${INSTALL_EXT_PGSQL:-false}
        - INSTALL_EXT_REDIS=${INSTALL_EXT_REDIS:-false}
        - INSTALL_EXT_SQLSRV=${INSTALL_EXT_SQLSRV:-false}
        - INSTALL_EXT_ORACL=${INSTALL_EXT_ORACL:-false}
    image: ${SUFFIX_APP_NAME:-it-dev-workflow-base}-app
    container_name: ${SUFFIX_APP_NAME:-it-dev-workflow-base}-app
    restart: unless-stopped
    working_dir: /var/www
    # Caps how much of the shared server this one project's app container
    # can take — several unrelated projects run on the same box (see README
    # port/permission sections), so one runaway container (queue leak,
    # n+1 query storm) shouldn't be able to starve the others. Override in
    # .env if this project genuinely needs more (e.g. a heavy Horizon
    # workload).
    mem_limit: ${APP_MEM_LIMIT:-1g}
    cpus: "${APP_CPUS:-1.0}"
    volumes:
      - .:/var/www
      - ./docker/app/php.ini:/usr/local/etc/php/conf.d/php.ini
      - ./docker/app/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:ro
    environment:
      - APP_ENV=${APP_ENV:-local}
      - SUPERVISOR_HORIZON_ENABLED=${SUPERVISOR_HORIZON_ENABLED:-false}
    networks:
      - app_network
    # required: false makes each of these an OPTIONAL dependency: if the
    # service's profile isn't active for this project (e.g. DB_CHOICE=none,
    # or "ext saja" without a container), Compose skips it entirely instead
    # of erroring "service is not running". If the profile IS active,
    # Compose still waits for that service to report healthy before
    # starting `app` — closing the "container started" vs "container ready
    # to accept connections" gap that used to be papered over only by the
    # migrate retry-loop in entrypoint.sh (kept as a second safety net, see
    # that file). Requires Docker Compose v2.20+ (mid-2023) for the
    # `required: false` key — check `docker compose version` on any host
    # this hasn't been tried on yet.
    depends_on:
      mariadb:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false

  nginx:
    image: nginx:1.27-alpine
    container_name: ${SUFFIX_APP_NAME:-it-dev-workflow-base}-nginx
    restart: unless-stopped
    mem_limit: ${NGINX_MEM_LIMIT:-128m}
    cpus: "${NGINX_CPUS:-0.5}"
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app_network

  # Vite dev server / asset build. Works for both Blade (@vite() compiling
  # CSS/JS) and Inertia (SPA bundle) — projects that don't build any JS at
  # all simply leave `node` out of COMPOSE_PROFILES.
  node:
    build:
      context: .
      dockerfile: ./docker/node/Dockerfile
      args:
        - NODE_VERSION=${NODE_VERSION:-22}
        - UID=${UID:-1000}
        - USR=${USR:-www-data}
        - GID=${GID:-1000}
        - GRP=${GRP:-www-data}
    image: ${SUFFIX_APP_NAME:-it-dev-workflow-base}-node
    container_name: ${SUFFIX_APP_NAME:-it-dev-workflow-base}-node
    restart: unless-stopped
    working_dir: /var/www
    mem_limit: ${NODE_MEM_LIMIT:-1g}
    cpus: "${NODE_CPUS:-1.0}"
    volumes:
      - .:/var/www
    depends_on:
      - app
    ports:
      - "${NODE_PORT:-5173}:${NODE_PORT:-5173}"
    environment:
      - APP_ENV=${APP_ENV:-local}
      - NODE_PORT=${NODE_PORT:-5173}
    networks:
      - app_network
    profiles: ["node"]

  # Optional standalone Python engine (e.g. a small FastAPI/Flask service or
  # worker) living in ./python at the project root, independent of the
  # Laravel app container.
  python:
    build:
      context: .
      dockerfile: ./docker/python/Dockerfile
      args:
        - PYTHON_VERSION=${PYTHON_VERSION:-3.12}
        - UID=${UID:-1000}
        - USR=${USR:-appuser}
        - GID=${GID:-1000}
        - GRP=${GRP:-appuser}
    image: ${SUFFIX_APP_NAME:-it-dev-workflow-base}-python
    container_name: ${SUFFIX_APP_NAME:-it-dev-workflow-base}-python
    restart: unless-stopped
    working_dir: /var/www/python
    mem_limit: ${PYTHON_MEM_LIMIT:-512m}
    cpus: "${PYTHON_CPUS:-1.0}"
    volumes:
      - ./python:/var/www/python
    ports:
      - "${PYTHON_PORT:-8000}:${PYTHON_PORT:-8000}"
    environment:
      - PYTHON_START_CMD=${PYTHON_START_CMD:-python app.py}
    networks:
      - app_network
    profiles: ["python"]

  # DB_PASSWORD:-secret below is a parse-time fallback only (so this file
  # still parses for projects that never enable the mariadb/postgres
  # profile) — docker.sh's check_secrets() refuses to run `up`/`restart`
  # if DB_PASSWORD is empty or still literally "secret" while this profile
  # is active, so that placeholder should never actually reach a running
  # container. See docker.sh.
  mariadb:
    image: mariadb:${MARIADB_VERSION:-11.8.2}
    container_name: ${SUFFIX_APP_NAME:-it-dev-workflow-base}-mariadb
    restart: unless-stopped
    mem_limit: ${MARIADB_MEM_LIMIT:-512m}
    cpus: "${MARIADB_CPUS:-1.0}"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-app}
      MYSQL_USER: ${DB_USERNAME:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      # healthcheck.sh (bundled with the official image) also waits for
      # InnoDB to finish initializing — plain `mysqladmin ping` can report
      # "up" before that, and before the MYSQL_DATABASE/MYSQL_USER bootstrap
      # above has finished on first boot.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app_network
    profiles: ["mariadb"]

  postgres:
    image: postgres:${POSTGRES_VERSION:-17.5}
    container_name: ${SUFFIX_APP_NAME:-it-dev-workflow-base}-postgres
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    cpus: "${POSTGRES_CPUS:-1.0}"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: ${DB_DATABASE:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes to a literal $ inside the container's shell (reading
      # POSTGRES_USER/POSTGRES_DB from the container's own env, set above)
      # instead of being interpolated by Compose on the host.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - app_network
    profiles: ["postgres"]

  # REDIS_PASSWORD:-secretpassword below is a parse-time fallback only —
  # same reasoning and same guard (docker.sh's check_secrets()) as
  # DB_PASSWORD above.
  redis:
    image: redis:${REDIS_VERSION:-7.2.10-alpine}
    container_name: ${SUFFIX_APP_NAME:-it-dev-workflow-base}-redis
    restart: unless-stopped
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    cpus: "${REDIS_CPUS:-0.5}"
    volumes:
      - redis_data:/data
    ports:
      - "${REDISD_PORT:-6379}:6379"
    # --maxmemory is intentionally set BELOW mem_limit above (leaves
    # headroom for Redis's own process overhead, not just its dataset) —
    # without it, the kernel would eventually OOM-kill redis-server outright
    # once mem_limit is hit instead of Redis proactively evicting keys
    # (allkeys-lru) first.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-secretpassword}", "--maxmemory", "${REDIS_MAXMEMORY:-200mb}", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      # Password interpolated by Compose on the host (single $, same as
      # `command:` above) rather than read from a container env var — this
      # service has no `environment:` block of its own. Already visible in
      # `docker inspect`/`ps aux` via --requirepass above, so this isn't a
      # new exposure.
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-secretpassword} --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - app_network
    profiles: ["redis"]

networks:
  app_network:

volumes:
  mariadb_data:
  postgres_data:
  redis_data:
