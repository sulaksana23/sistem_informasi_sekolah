<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Sistem Informasi Sekolah">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#002b17"/>
      <stop offset="0.5" stop-color="#005f33"/>
      <stop offset="1" stop-color="#0b7a45"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3a8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7dd3a8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <circle cx="1055" cy="60" r="210" fill="url(#glow)"/>
  <circle cx="1090" cy="275" r="120" fill="#ffffff" fill-opacity="0.05"/>

  <g transform="translate(72,74)">
    <rect width="76" height="76" rx="18" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="0.75" y="0.75" width="74.5" height="74.5" rx="17.5" fill="none" stroke="#ffffff" stroke-opacity="0.45"/>
    <path d="M38 16 L56 25 V43 C56 54 47.5 59.5 38 63 C28.5 59.5 20 54 20 43 V25 Z"
          fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linejoin="round"/>
    <path d="M29 38 l6.5 6.5 L48 31" fill="none" stroke="#a7f3d0" stroke-width="3.6"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="176" y="118" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif"
