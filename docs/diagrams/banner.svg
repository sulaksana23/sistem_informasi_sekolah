  <g font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">
    <rect x="178" y="178" width="122" height="30" rx="15" fill="#ffffff" fill-opacity="0.14"/>
    <text x="239" y="198" fill="#ffffff" text-anchor="middle">Laravel 13</text>
    <rect x="310" y="178" width="104" height="30" rx="15" fill="#ffffff" fill-opacity="0.14"/>
    <text x="362" y="198" fill="#ffffff" text-anchor="middle">Inertia v2</text>
    <rect x="424" y="178" width="112" height="30" rx="15" fill="#ffffff" fill-opacity="0.14"/>
    <text x="480" y="198" fill="#ffffff" text-anchor="middle">React 19</text>
    <rect x="546" y="178" width="134" height="30" rx="15" fill="#ffffff" fill-opacity="0.14"/>
    <text x="613" y="198" fill="#ffffff" text-anchor="middle">TypeScript 5.9</text>
    <rect x="690" y="178" width="116" height="30" rx="15" fill="#ffffff" fill-opacity="0.14"/>
    <text x="748" y="198" fill="#ffffff" text-anchor="middle">MariaDB</text>
    <rect x="816" y="178" width="98" height="30" rx="15" fill="#ffffff" fill-opacity="0.14"/>
    <text x="865" y="198" fill="#ffffff" text-anchor="middle">Docker</text>
  </g>

  <line x1="72" y1="248" x2="1128" y2="248" stroke="#ffffff" stroke-opacity="0.18"/>

  <g font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="72" y="282" font-size="12" fill="#9fe6c0">Multi-tenant per sekolah</text>
    <text x="268" y="282" font-size="12" fill="#9fe6c0">Peran admin · staff · guru</text>
    <text x="486" y="282" font-size="12" fill="#9fe6c0">Absensi &amp; nilai</text>
    <text x="650" y="282" font-size="12" fill="#9fe6c0">Laporan + ekspor CSV</text>
    <text x="828" y="282" font-size="12" fill="#9fe6c0">Isolasi data fail-closed</text>
