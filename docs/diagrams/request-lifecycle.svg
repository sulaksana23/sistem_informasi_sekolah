<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1310" viewBox="0 0 1400 1310" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Siklus Request &amp; Resolusi Tenant">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#005f33"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
</defs>
<rect width="1400" height="1310" fill="#ffffff"/>
<text x="48" y="58" font-size="26" font-weight="700" fill="#0f172a" letter-spacing="-0.4">Siklus Request &amp; Resolusi Tenant</text>
<text x="48" y="84" font-size="13" fill="#64748b">Fail-closed: tanpa keanggotaan sah tidak ada data sekolah, tidak ada izin, request dialihkan.</text>
<line x1="48" y1="102" x2="1352" y2="102" stroke="#cbd5e1"/>
<rect x="100" y="130" width="460" height="85" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="118" y="162" font-size="14" font-weight="650" fill="#0f172a">1 · HTTP request masuk</text>
<text x="118" y="182" font-size="11.5" fill="#64748b">Inertia visit atau form submit dari browser</text>
<polygon points="330.0,240 560,286.0 330.0,332 100,286.0" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/>
<text x="330.0" y="280" font-size="14" font-weight="650" fill="#0f172a" text-anchor="middle">2 · Sudah login?</text>
<text x="330.0" y="300" font-size="11.5" fill="#64748b" text-anchor="middle">session guard</text>
<rect x="100" y="372" width="460" height="102" rx="10" fill="#ffffff" stroke="#005f33" stroke-width="1.5"/>
<text x="118" y="404" font-size="14" font-weight="650" fill="#0f172a">3 · Muat keanggotaan</text>
<text x="118" y="424" font-size="11.5" fill="#64748b">SetTenantContext: SELECT school_memberships</text>
<text x="118" y="441" font-size="11.5" fill="#64748b">WHERE user_id = akun aktif</text>
<polygon points="330.0,490 560,536.0 330.0,582 100,536.0" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/>
<text x="330.0" y="530" font-size="14" font-weight="650" fill="#0f172a" text-anchor="middle">4 · Punya keanggotaan?</text>
<text x="330.0" y="550" font-size="11.5" fill="#64748b" text-anchor="middle">school_memberships</text>
<rect x="100" y="622" width="460" height="102" rx="10" fill="#ffffff" stroke="#005f33" stroke-width="1.5"/>
<text x="118" y="654" font-size="14" font-weight="650" fill="#0f172a">5 · Tetapkan sekolah aktif</text>
<text x="118" y="674" font-size="11.5" fill="#64748b">current_school_id bila masih sah,</text>
<text x="118" y="691" font-size="11.5" fill="#64748b">jika tidak → keanggotaan pertama</text>
<polygon points="330.0,750 560,798.0 330.0,846 100,798.0" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/>
<text x="330.0" y="792" font-size="14" font-weight="650" fill="#0f172a" text-anchor="middle">6 · Lolos Gate?</text>
<text x="330.0" y="812" font-size="11.5" fill="#64748b" text-anchor="middle">can:school.manage | academic | report</text>
<rect x="100" y="886" width="460" height="85" rx="10" fill="#ffffff" stroke="#005f33" stroke-width="1.5"/>
<text x="118" y="918" font-size="14" font-weight="650" fill="#0f172a">7 · Controller + FormRequest</text>
<text x="118" y="938" font-size="11.5" fill="#64748b">Validasi server · rule exists dibatasi school_id</text>
<rect x="100" y="976" width="460" height="85" rx="10" fill="#ffffff" stroke="#005f33" stroke-width="1.5"/>
<text x="118" y="1008" font-size="14" font-weight="650" fill="#0f172a">8 · Service → Repository</text>
<text x="118" y="1028" font-size="11.5" fill="#64748b">Cek kesetiaan tenant semua referensi</text>
<rect x="100" y="1066" width="460" height="85" rx="10" fill="#ffffff" stroke="#005f33" stroke-width="1.5"/>
<text x="118" y="1098" font-size="14" font-weight="650" fill="#0f172a">9 · Model + global scope</text>
<text x="118" y="1118" font-size="11.5" fill="#64748b">WHERE school_id = sekolah aktif</text>
<rect x="100" y="1156" width="460" height="85" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="118" y="1188" font-size="14" font-weight="650" fill="#0f172a">10 · Response Inertia</text>
<text x="118" y="1208" font-size="11.5" fill="#64748b">Page React + shared props · redirect + flash</text>
<rect x="700" y="240" width="320" height="72" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="1.5"/>
<text x="718" y="272" font-size="14" font-weight="650" fill="#0f172a">Redirect /login</text>
<text x="718" y="292" font-size="11.5" fill="#64748b">middleware guest</text>
<rect x="700" y="490" width="320" height="72" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="1.5"/>
<text x="718" y="522" font-size="14" font-weight="650" fill="#0f172a">Redirect /no-school</text>
<text x="718" y="542" font-size="11.5" fill="#64748b">akun belum tergabung</text>
<rect x="700" y="750" width="320" height="72" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="1.5"/>
<text x="718" y="782" font-size="14" font-weight="650" fill="#0f172a">403 Forbidden</text>
<text x="718" y="802" font-size="11.5" fill="#64748b">deny-by-default</text>
<rect x="700" y="880" width="660" height="170" rx="10" fill="#eaf6f0" stroke="#005f33" stroke-width="1.5"/>
<rect x="714" y="870" width="78" height="20" rx="10" fill="#005f33"/>
<text x="753" y="884" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">INVARIAN</text>
<text x="718" y="924" font-size="14" font-weight="650" fill="#0f172a">Invarian TenantContext</text>
<text x="718" y="944" font-size="11.5" fill="#64748b">Konteks disimpan di attributes Request, bukan properti global:</text>
<text x="718" y="961" font-size="11.5" fill="#64748b">tidak bocor antar request maupun antar worker queue.</text>
<text x="718" y="978" font-size="11.5" fill="#64748b">Tanpa konteks → query data sekolah 0 baris, semua Gate false.</text>
<text x="718" y="995" font-size="11.5" fill="#64748b">Sesi hanya menyimpan current_school_id, bukan peran.</text>
