<text x="768" y="204" font-size="14" font-weight="650" fill="#0f172a">php artisan school:create-school &quot;Nama&quot;</text>
<text x="768" y="224" font-size="11.5" fill="#64748b">Membuat tenant pada tabel schools</text>
<text x="768" y="241" font-size="11.5" fill="#64748b">Opsi --member-email= untuk admin pertama</text>
<rect x="750" y="300" width="580" height="114" rx="10" fill="#ffffff" stroke="#005f33" stroke-width="1.5"/>
<rect x="764" y="290" width="85" height="20" rx="10" fill="#005f33"/>
