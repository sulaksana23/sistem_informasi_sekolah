<text x="768" y="344" font-size="14" font-weight="650" fill="#0f172a">php artisan school:assign-member {email} {role}</text>
<text x="768" y="364" font-size="11.5" fill="#64748b">role: admin | staff | teacher</text>
<text x="768" y="381" font-size="11.5" fill="#64748b">--school-id wajib bila tenant lebih dari satu</text>
